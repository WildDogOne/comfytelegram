<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title id="page-title">Draw mask</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #111;
    --fg: #eee;
    --accent: #2ea6ff;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }
  #status {
    padding: 10px 14px;
    font-size: 14px;
    text-align: center;
  }
  #canvas-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
  }
  #display-canvas {
    max-width: 100%;
    max-height: 100%;
    touch-action: none;
    border-radius: 4px;
    transform-origin: 0 0;
  }
  #controls {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  }
  #controls label {
    font-size: 13px;
    white-space: nowrap;
  }
  #brush-size {
    flex: 1;
  }
  button {
    font-size: 15px;
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #333;
    color: var(--fg);
  }
  #done-btn {
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  button:disabled {
    opacity: 0.5;
  }
  #erase-btn.active {
    background: var(--accent);
    color: #fff;
  }
  #autofill-btn {
    opacity: 0.5;
  }
  #autofill-btn.active {
    background: var(--accent);
    color: #fff;
    opacity: 1;
  }
  #brush-cursor {
    position: fixed;
    left: 0;
    top: 0;
    width: 0;
    height: 0;
    box-sizing: border-box;
    border-radius: 50%;
    border: 2px solid rgba(255, 45, 45, 0.9);
    background: rgba(255, 45, 45, 0.15);
    transform: translate(-50%, -50%);
    pointer-events: none;
    display: none;
    z-index: 10;
  }
  #brush-cursor.erasing {
    border-color: rgba(255, 255, 255, 0.9);
    background: rgba(255, 255, 255, 0.15);
  }
  /* Undo/redo share `#controls` with the brush slider and Fill/Erase
     toggles rather than getting a row of their own — screen space in the
     WebApp is tight, and unlike those two toggles these have no persistent
     on/off state worth a text label, so a bare glyph keeps them narrow. */
  .icon-btn {
    padding: 10px 12px;
    flex: none;
  }
  #button-row {
    display: flex;
    gap: 10px;
    padding: 0 14px calc(14px + env(safe-area-inset-bottom));
  }
  #button-row button {
    flex: 1;
  }
  /* "✏️ Detail Prompt" only (`Job.mode == "mask_prompt"`) — a compact strip
     below the canvas (which keeps its own `flex: 1` regardless of DOM
     order, so this doesn't shrink it below what's left after this panel's
     own capped height), capped so the canvas still gets most of the
     screen; scrolls internally if a long prompt plus the keyboard leaves
     it no other room. Hidden by default (`display: none` inline in the
     markup); shown by `applyMeta` once `GET /jobs/{token}/meta` says so. */
  #prompt-fields {
    max-height: 34vh;
    overflow-y: auto;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-sizing: border-box;
  }
  #readonly-info {
    font-size: 12px;
    line-height: 1.4;
    color: #9a9a9a;
  }
  .field-label {
    font-size: 13px;
    font-weight: 600;
  }
  .field-hint {
    font-weight: 400;
    opacity: 0.6;
  }
  /* `$name` autocomplete for the prompt fields. Fixed rather than absolute,
     since #prompt-fields scrolls internally and would clip it; placed above
     or below the focused textarea by placeRefMenu, whichever has more room
     (above, usually — the on-screen keyboard takes the space below). */
  #ref-menu {
    position: fixed;
    z-index: 20;
    display: none;
    overflow-y: auto;
    background: #1c1c1c;
    border: 1px solid #333;
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
  }
  .ref-item {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 9px 10px;
    font-size: 14px;
    cursor: pointer;
  }
  .ref-item + .ref-item {
    border-top: 1px solid #262626;
  }
  .ref-item.active {
    background: #26394a;
  }
  .ref-name {
    font-weight: 600;
    white-space: nowrap;
  }
  .ref-preview {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12px;
    color: #9a9a9a;
  }
  textarea {
    width: 100%;
    box-sizing: border-box;
    font-size: 15px;
    font-family: inherit;
    padding: 8px 10px;
    border: 1px solid #333;
    border-radius: 8px;
    background: #1c1c1c;
    color: var(--fg);
    resize: vertical;
  }
  #denoise-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  #denoise-row label {
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  #denoise-input {
    flex: 1;
    min-width: 100px;
  }
  #denoise-value {
    font-size: 13px;
    color: #9a9a9a;
    min-width: 3.5em;
    text-align: right;
  }
  /* Both checkboxes share one row so a job with only one of them available
     (the common case) doesn't spend a whole row's height on it — outside
     #prompt-fields, unlike tile-controlnet-row used to be, since the LoRA
     checkbox also has to show for a plain "mask" job ("🖌️ Draw Mask"), not
     just "mask_prompt" ("✏️ Detail Prompt"). Hidden by default; applyMeta
     shows this container whenever either child checkbox is shown, and
     wraps to two lines if a narrow screen can't fit both on one. */
  #toggle-row {
    display: none;
    flex-wrap: wrap;
    gap: 4px 18px;
    padding: 8px 14px;
    border-top: 1px solid #222;
  }
  #toggle-row label {
    font-size: 13px;
    display: none;
    align-items: flex-start;
    gap: 6px;
  }
  /* Fold-away wrapper around #prompt-fields and #toggle-row — on a phone
     those two together can eat half the screen, so the header bar below
     collapses them out of the way and hands that height back to the
     canvas (`#canvas-wrap`'s `flex: 1` takes it up automatically, and
     `#display-canvas`'s `max-width`/`max-height` let it grow into it).
     Hidden until `initOptionsPanel` finds something to put in it. */
  #options-panel {
    display: none;
    border-top: 1px solid #222;
  }
  #options-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 8px 14px;
    border-radius: 0;
    background: transparent;
    font-size: 13px;
    font-weight: 600;
    text-align: left;
  }
  #options-caret {
    display: inline-block;
    transition: transform 0.15s;
  }
  #options-summary {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 400;
    color: #9a9a9a;
    display: none;
  }
  #options-panel.collapsed #options-body {
    display: none;
  }
  #options-panel.collapsed #options-caret {
    transform: rotate(-90deg);
  }
  #options-panel.collapsed #options-summary {
    display: block;
  }
</style>
</head>
<body>
  <div id="status">Loading image…</div>

  <!-- The image/canvas comes first — everything else (prompt fields,
       brush controls, action buttons) sits below it, so there's always
       something to look at immediately instead of scrolling past a panel
       of fields first. -->
  <div id="canvas-wrap">
    <canvas id="display-canvas"></canvas>
  </div>
  <div id="brush-cursor"></div>
  <div id="ref-menu" role="listbox"></div>

  <!-- "✏️ Detail Prompt" only (`Job.mode == "mask_prompt"`) — hidden by
       default; shown by `applyMeta` once `GET /jobs/{token}/meta` says so.
       Submitted together with the mask in one `POST /jobs/{token}/mask`
       from the same "Done" tap below — there's no separate save step. -->
  <div id="options-panel">
  <button id="options-toggle" type="button" aria-expanded="true" aria-controls="options-body">
    <span id="options-caret">▾</span>
    <span id="options-title">Options</span>
    <span id="options-summary"></span>
  </button>
  <div id="options-body">
  <div id="prompt-fields" style="display: none;">
    <div id="readonly-info"></div>
    <div>
      <div class="field-label">Positive <span class="field-hint" id="positive-hint">— $name inserts a character or favorite</span></div>
      <textarea
        id="positive-input"
        rows="2"
        placeholder="Leave blank to use this image's own positive prompt"
      ></textarea>
    </div>
    <div>
      <div class="field-label">Negative</div>
      <textarea
        id="negative-input"
        rows="2"
        placeholder="Leave blank to use this image's own negative prompt"
      ></textarea>
    </div>
    <div id="denoise-row">
      <label><input type="checkbox" id="denoise-override" /> Override denoise</label>
      <input type="range" id="denoise-input" min="0" max="1" step="0.01" value="0.5" disabled />
      <span id="denoise-value">detailer default</span>
    </div>
  </div>

  <!-- Both checkboxes live here, outside #prompt-fields — tile-ControlNet
       is still only ever available for a "mask_prompt" job ("✏️ Detail
       Prompt"), but the LoRA checkbox also has to show for a plain "mask"
       job ("🖌️ Draw Mask"), so the shared row can't live inside that panel.
       Each <label> is hidden by default (#toggle-row label CSS) and shown
       individually by applyMeta when its own `meta.*_available` flag says
       so — hidden rather than shown-disabled, since there'd be nothing for
       either checkbox to turn on/off otherwise. Both are pre-checked from
       their own `meta.*_default` but always submitted as an explicit
       true/false, same as "Override denoise" is not. -->
  <div id="toggle-row">
    <label id="tile-controlnet-row"
      ><input type="checkbox" id="tile-controlnet-toggle" /> Tile ControlNet (experimental,
      steadies the detailer against the source image)</label
    >
    <label id="lora-row"
      ><input type="checkbox" id="lora-toggle" /> Disable LoRAs for this detailer pass</label
    >
  </div>
  </div>
  </div>

  <div id="controls">
    <label for="brush-size">Brush</label>
    <input type="range" id="brush-size" min="4" max="100" value="20" />
    <button id="autofill-btn" type="button" class="active">🪣 Fill</button>
    <button id="erase-btn" type="button">🧹 Erase</button>
    <button id="undo-btn" type="button" class="icon-btn" disabled title="Undo">↩</button>
    <button id="redo-btn" type="button" class="icon-btn" disabled title="Redo">↪</button>
  </div>
  <div id="button-row">
    <button id="clear-btn">Clear</button>
    <button id="done-btn">Done</button>
  </div>

<script>
(function () {
  "use strict";

  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  // The job token is the final path segment of this page's own URL —
  // the relay serves this same static file for every job, so the page
  // itself has to pull the token back out rather than being templated.
  var token = location.pathname.split("/").filter(Boolean).pop();

  var statusEl = document.getElementById("status");
  var canvasWrap = document.getElementById("canvas-wrap");
  var displayCanvas = document.getElementById("display-canvas");
  var displayCtx = displayCanvas.getContext("2d");
  var brushSizeInput = document.getElementById("brush-size");
  var clearBtn = document.getElementById("clear-btn");
  var doneBtn = document.getElementById("done-btn");
  var eraseBtn = document.getElementById("erase-btn");
  var autofillBtn = document.getElementById("autofill-btn");
  var undoBtn = document.getElementById("undo-btn");
  var redoBtn = document.getElementById("redo-btn");
  var brushCursor = document.getElementById("brush-cursor");
  // "✏️ Detail Prompt" only (`#prompt-fields`, hidden unless `applyMeta`
  // turns `promptFieldsEnabled` on) — grabbed unconditionally either way,
  // same as every other element here, since the elements always exist in
  // the markup regardless of which mode a given job turns out to be.
  var promptFieldsEl = document.getElementById("prompt-fields");
  var readonlyEl = document.getElementById("readonly-info");
  var positiveInput = document.getElementById("positive-input");
  var negativeInput = document.getElementById("negative-input");
  var denoiseOverride = document.getElementById("denoise-override");
  var denoiseInput = document.getElementById("denoise-input");
  var denoiseValueEl = document.getElementById("denoise-value");
  // Shared row for the tile-ControlNet and "Disable LoRAs" checkboxes (see
  // applyMeta) — outside #prompt-fields since the LoRA one has to show for
  // a plain "mask" job too, not just "mask_prompt".
  var toggleRowEl = document.getElementById("toggle-row");
  var tileControlnetRow = document.getElementById("tile-controlnet-row");
  var tileControlnetToggle = document.getElementById("tile-controlnet-toggle");
  var loraRow = document.getElementById("lora-row");
  var loraToggle = document.getElementById("lora-toggle");
  var optionsPanel = document.getElementById("options-panel");
  var optionsToggle = document.getElementById("options-toggle");
  var optionsTitle = document.getElementById("options-title");
  var optionsSummary = document.getElementById("options-summary");

  // On by default (matches the button's own initial "active" class in the
  // markup) — `finishAction` checks this before running `runEnclosedFill`,
  // so toggling off just stops future strokes from triggering it. Anything
  // already auto-filled before toggling off is left as-is, same as
  // toggling erase mode doesn't undo prior painting.
  var autoFillEnabled = true;

  autofillBtn.addEventListener("click", function () {
    autoFillEnabled = !autoFillEnabled;
    autofillBtn.classList.toggle("active", autoFillEnabled);
  });

  // Full-resolution mask, offscreen — this is what actually gets
  // submitted. Kept at the source image's own pixel dimensions so the
  // mask lines up 1:1 with it server-side, independent of however small
  // the phone's screen makes `displayCanvas`.
  var maskCanvas = document.createElement("canvas");
  var maskCtx = maskCanvas.getContext("2d");

  // Selection highlight, offscreen, at displayCanvas's resolution — kept
  // fully *opaque* (solid red, no alpha) so overlapping dabs within one
  // stroke can't compound each other's transparency. `renderDisplay`
  // composites this whole layer onto the visible canvas at one flat
  // BRUSH_OPACITY each redraw, so the highlight always reads as a single
  // consistent opacity regardless of how many times a spot was painted
  // over.
  var overlayCanvas = document.createElement("canvas");
  var overlayCtx = overlayCanvas.getContext("2d");
  var BRUSH_OPACITY = 0.8;

  // Auto-fill-enclosed-area scratch canvases. `overlayCanvas` can be up to
  // 4096px on a side (see `image.onload`), and running a flood fill at that
  // resolution after every stroke would be slow enough to feel like lag —
  // so `runEnclosedFill` instead flood-fills a small fixed-size
  // downscaled copy of it (`fillDetectCanvas`) and upscales whatever it
  // finds back onto the real `maskCanvas`/`overlayCanvas`. `fillShapeCanvas`
  // is a reused scratch buffer for that upscale step, sized to match
  // `fillDetectCanvas` each call — it holds one shape at a time (first the
  // white one drawn onto `maskCanvas`, then the red one drawn onto
  // `overlayCanvas`), never both at once, so one canvas covers both.
  var fillDetectCanvas = document.createElement("canvas");
  var fillDetectCtx = fillDetectCanvas.getContext("2d");
  var fillShapeCanvas = document.createElement("canvas");
  var fillShapeCtx = fillShapeCanvas.getContext("2d");
  var FILL_DETECT_MAX_DIM = 400;
  // Above this alpha, a detection-grid cell counts as a "wall" pixel a
  // stroke actually painted. Comfortably below full opacity (255) so a
  // thin brush line surviving the downscale into `fillDetectCanvas` (which
  // partially averages it with its unpainted neighbors, same as scaling
  // down any other image) still reads as painted instead of vanishing —
  // while still safely above anti-aliasing noise on an otherwise-unpainted
  // pixel.
  var FILL_ALPHA_THRESHOLD = 32;

  var image = new Image();
  var drawing = false;
  var erasing = false;
  // Alt+click inverts `erasing` for that one stroke/line only: brush mode
  // erases, erase mode paints. Latched at pointerdown (`onPointerDown`) and
  // cleared by `finishAction`, so letting go of Alt mid-drag doesn't flip
  // the stroke halfway through. Mouse/pen only, like shift-click.
  var invertStroke = false;
  var scale = 1; // maskCanvas pixels per displayCanvas pixel

  // Photoshop-style shift-click straight line: updated by every dab
  // (freehand or line, paint or erase — set inside `paintAt` itself) so a
  // shift+click always has an anchor to draw from, chaining point to point
  // across repeated shift-clicks the same way Photoshop's own does. Reset
  // to null by `resetMask` — after a clear there's no anchor left that
  // still means anything. Mouse/pen only (`onPointerDown`, below); touch
  // has no reliable modifier-key signal and its second contact point is
  // already claimed by pinch-zoom.
  var lastPaintPoint = null;

  // Undo/redo, as a log of discrete *actions* (one per completed stroke,
  // shift-click line, or Clear) rather than pixel snapshots. `maskCanvas`
  // is sized to the source image's own full resolution — routinely well
  // past `overlayCanvas`'s already-capped-at-4096 display size (see
  // `image.onload`) once a prior post-processing pass has upscaled it — so
  // keeping a raster copy of it per undo step would burn tens of MB every
  // single stroke. An action is just a handful of numbers (each dab's
  // point/radius/erase flag) regardless of image size, so undo/redo
  // instead replays the whole log from a blank canvas — cheap, since a
  // real editing session is at most a few dozen strokes.
  //
  // `actionHistory` holds every action ever committed, in order;
  // `historyIndex` is how many of them are currently "applied" (0..
  // length). Undo/redo just move `historyIndex` and replay; committing a
  // *new* action truncates anything past the current index first, the
  // standard "a fresh edit erases the redo branch" rule.
  var actionHistory = [];
  var historyIndex = 0;
  // The action currently being accumulated by an in-progress stroke/line —
  // null the rest of the time. `paintAt` appends to it; `finishAction`
  // commits and clears it.
  var currentAction = null;

  function updateUndoRedoButtons() {
    undoBtn.disabled = historyIndex === 0;
    redoBtn.disabled = historyIndex >= actionHistory.length;
  }

  function commitAction(action) {
    actionHistory.length = historyIndex;
    actionHistory.push(action);
    historyIndex = actionHistory.length;
    updateUndoRedoButtons();
  }

  // Re-applies one previously-committed action's pixels onto the current
  // (already-blank, via `replayHistory`) canvases — the replay counterpart
  // to actually drawing it live.
  function applyAction(action) {
    if (action.type === "clear") {
      resetMask();
      return;
    }
    for (var i = 0; i < action.dabs.length; i++) {
      var d = action.dabs[i];
      applyDab(d.x, d.y, d.radius, d.erase);
    }
    lastPaintPoint = action.dabs[action.dabs.length - 1];
    if (action.fill) runEnclosedFill();
  }

  function replayHistory() {
    resetMask();
    for (var i = 0; i < historyIndex; i++) {
      applyAction(actionHistory[i]);
    }
    renderDisplay();
    updateUndoRedoButtons();
  }

  function undo() {
    if (historyIndex === 0) return;
    historyIndex--;
    replayHistory();
  }

  function redo() {
    if (historyIndex >= actionHistory.length) return;
    historyIndex++;
    replayHistory();
  }

  // Zoom/pan of `displayCanvas` itself, via a CSS transform — two-finger
  // pinch on touch (one finger is already spoken for by drawing, so zoom/pan
  // has to live on a second finger, same convention most drawing apps use)
  // or mousewheel/trackpad on desktop, where there's no second finger at
  // all (see `handleWheel`). `view.zoom`/`tx`/`ty` name a
  // `translate(tx, ty) scale(zoom)` transform (`transform-origin: 0 0`, see
  // the CSS) applied straight to `#display-canvas` — deliberately not to
  // `#canvas-wrap`, so `canvas-wrap`'s own `overflow: hidden` box (the
  // visible "window") stays put on screen and just clips whatever of the
  // transformed canvas pokes outside it, instead of the whole window
  // growing with the zoom. `pointFromEvent`/`updateCursorSize` need no
  // changes at all for this — both already read the canvas's *current*
  // `getBoundingClientRect()`, which the browser computes post-transform
  // automatically.
  var view = { zoom: 1, tx: 0, ty: 0 };
  var pinch = null;
  // True from the moment a second finger touches down until *every*
  // finger has lifted — kept true across a drop to one finger mid-pinch
  // so that remaining finger can't accidentally start a stroke before the
  // gesture is fully released.
  var multiTouchActive = false;
  var MIN_ZOOM = 1;
  var MAX_ZOOM = 4;

  // Two fingers landing to start a pinch almost never touch down in the
  // exact same event — one is reliably a beat quicker. Waiting to see if a
  // second finger shows up before painting anything felt laggy (the dab
  // only ever appeared once the ambiguity resolved — on release, for a
  // fast tap, which reads as backwards: the mark seems to land on *lift*
  // instead of on *press*). So the first finger's dab is painted straight
  // away, same as before this feature existed, and instead just kept
  // *revocable* for up to `PINCH_DETECT_DELAY_MS` — `pendingTouch` holds a
  // small before-the-dab pixel snapshot (not a full-canvas copy; only the
  // brush's own bounding box) that a second finger arriving in time rolls
  // back via `restoreBrushRegion`, so the net result comes out exactly as
  // if the user had used two fingers from the start.
  //
  // A resting finger is never perfectly still — natural tremor moves it a
  // pixel or two even when the user's intent is to hold it in place while
  // their *other* finger lands for a pinch. Treating *any* `touchmove` as
  // "this is a deliberate drag" confirmed the dab on that tremor alone,
  // which defeated the revocable window regardless of how long
  // `PINCH_DETECT_DELAY_MS` was — the real second finger would arrive a
  // moment later to a dab that had already locked itself in. The fix is
  // the same "touch slop" dead zone every native touch/gesture framework
  // uses to tell a tap's jitter apart from a real drag (Android's
  // `ViewConfiguration` touch slop, Flutter's gesture arena, etc.):
  // `TOUCH_SLOP_PX` of movement from the initial touch point, measured in
  // raw screen pixels (not canvas pixels — the tremor is a physical-finger
  // phenomenon, so the threshold has to live in the same space regardless
  // of any zoom level), before `handleTouchMove` will treat it as a real
  // stroke and confirm the dab; movement that never exceeds it is ignored
  // outright, leaving the dab revocable for the rest of the delay window.
  var pendingTouch = null;
  var PINCH_DETECT_DELAY_MS = 180;
  var TOUCH_SLOP_PX = 10;

  function exceedsTouchSlop(clientX, clientY, fromX, fromY) {
    var dx = clientX - fromX;
    var dy = clientY - fromY;
    return dx * dx + dy * dy > TOUCH_SLOP_PX * TOUCH_SLOP_PX;
  }

  function cancelPendingTouch() {
    if (pendingTouch) {
      clearTimeout(pendingTouch.timer);
      pendingTouch = null;
    }
  }

  function snapshotBrushRegion(ctx, cx, cy, radius) {
    var pad = 2; // rounding safety margin
    var x = Math.max(0, Math.floor(cx - radius - pad));
    var y = Math.max(0, Math.floor(cy - radius - pad));
    var w = Math.min(ctx.canvas.width - x, Math.ceil(radius * 2 + pad * 2));
    var h = Math.min(ctx.canvas.height - y, Math.ceil(radius * 2 + pad * 2));
    if (w <= 0 || h <= 0) return null;
    return { x: x, y: y, data: ctx.getImageData(x, y, w, h) };
  }

  function restoreBrushRegion(ctx, snapshot) {
    if (snapshot) ctx.putImageData(snapshot.data, snapshot.x, snapshot.y);
  }

  function applyView() {
    displayCanvas.style.transform =
      "translate(" + view.tx + "px, " + view.ty + "px) scale(" + view.zoom + ")";
  }

  function touchDistance(t0, t1) {
    var dx = t0.clientX - t1.clientX;
    var dy = t0.clientY - t1.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function touchMidpoint(t0, t1) {
    return { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
  }

  // `rect.left/top` is always `layoutLeft/Top + view.tx/ty` — the
  // transform's own translate component doesn't change where the
  // *untransformed* box would sit in flex-centered layout — so this
  // recovers that fixed layout position, and the canvas-local point
  // currently sitting under (clientX, clientY), from the current (already
  // transformed) rect without ever having to reset the transform to
  // measure it. Shared by `startPinch` (anchor captured once, held fixed
  // for the rest of that gesture) and wheel-zoom (recomputed fresh every
  // discrete tick, since there's no single continuous gesture to anchor).
  function canvasAnchorPoint(clientX, clientY) {
    var rect = displayCanvas.getBoundingClientRect();
    var layoutLeft = rect.left - view.tx;
    var layoutTop = rect.top - view.ty;
    return {
      layoutLeft: layoutLeft,
      layoutTop: layoutTop,
      x: (clientX - layoutLeft - view.tx) / view.zoom,
      y: (clientY - layoutTop - view.ty) / view.zoom,
    };
  }

  function startPinch(t0, t1) {
    var mid = touchMidpoint(t0, t1);
    var anchor = canvasAnchorPoint(mid.x, mid.y);
    pinch = {
      startDist: touchDistance(t0, t1),
      startZoom: view.zoom,
      layoutLeft: anchor.layoutLeft,
      layoutTop: anchor.layoutTop,
      // The canvas-local point (in `displayCanvas`'s own unscaled CSS
      // pixels) currently sitting under the pinch midpoint — held fixed
      // under that midpoint as the gesture continues, which is what makes
      // a pinch feel anchored rather than the image sliding around.
      anchor: { x: anchor.x, y: anchor.y },
    };
  }

  function updatePinch(t0, t1) {
    if (!pinch) return;
    var dist = touchDistance(t0, t1);
    var mid = touchMidpoint(t0, t1);
    var newZoom = pinch.startZoom * (dist / pinch.startDist);
    newZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, newZoom));
    view.zoom = newZoom;
    if (newZoom <= MIN_ZOOM) {
      // Snap fully back to rest — pinching all the way back in is the
      // user's "reset zoom" gesture, so don't leave a stray pan offset
      // that would otherwise need a second gesture to notice and undo.
      view.tx = 0;
      view.ty = 0;
    } else {
      view.tx = mid.x - pinch.layoutLeft - newZoom * pinch.anchor.x;
      view.ty = mid.y - pinch.layoutTop - newZoom * pinch.anchor.y;
    }
    applyView();
  }

  // Mousewheel/trackpad zoom, for desktop where there's no second finger
  // to pinch with. Each event is its own discrete step rather than one
  // continuous gesture, so — unlike `startPinch`/`updatePinch`, which cache
  // an anchor once and hold it for the gesture's duration — the anchor is
  // recomputed fresh from the *current* view every tick, then applied
  // immediately; consecutive ticks compose correctly since each one starts
  // from where the last left off.
  var WHEEL_ZOOM_SENSITIVITY = 0.0015;

  function zoomAtPoint(clientX, clientY, factor) {
    var anchor = canvasAnchorPoint(clientX, clientY);
    var newZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, view.zoom * factor));
    if (newZoom === view.zoom) return;
    view.zoom = newZoom;
    if (newZoom <= MIN_ZOOM) {
      // Same "pinched all the way back in" reset as updatePinch — snap the
      // pan back too rather than leaving a stray offset at rest zoom.
      view.tx = 0;
      view.ty = 0;
    } else {
      view.tx = clientX - anchor.layoutLeft - newZoom * anchor.x;
      view.ty = clientY - anchor.layoutTop - newZoom * anchor.y;
    }
    applyView();
  }

  function handleWheel(evt) {
    evt.preventDefault();
    var factor = Math.exp(-evt.deltaY * WHEEL_ZOOM_SENSITIVITY);
    zoomAtPoint(evt.clientX, evt.clientY, factor);
  }

  displayCanvas.addEventListener("wheel", handleWheel, { passive: false });

  function setStatus(text) {
    statusEl.textContent = text;
  }

  // The brush slider is in on-screen CSS pixels at 1x zoom, converted here
  // to `displayCanvas` pixels for painting. It used to *be* canvas pixels,
  // but that raster's resolution is picked at load from the space
  // `#canvas-wrap` happens to have (see `image.onload`), so the same slider
  // value covered a different share of the image depending on the screen,
  // the image's resolution, and whether the options panel was taking room
  // — "🩹 Fix Artifact" (no panel) and "✏️ Detail Prompt" opened with
  // visibly different default brushes. `clientWidth` is the canvas's
  // layout width, before the zoom transform, so zooming in still makes the
  // brush cover less of the image, as before.
  function brushDiameter() {
    var layoutWidth = displayCanvas.clientWidth || displayCanvas.width;
    return (Number(brushSizeInput.value) * displayCanvas.width) / layoutWidth;
  }

  // `#brush-cursor` is `position: fixed`, sized/positioned straight from
  // viewport coordinates — no relative-ancestor math needed, and it stays
  // correct across the canvas's own centering/scaling inside `#canvas-wrap`.
  // Its diameter is the slider value (CSS pixels at 1x, see
  // `brushDiameter`) times the current zoom.
  function updateCursorSize() {
    var diameterCss = Number(brushSizeInput.value) * view.zoom;
    brushCursor.style.width = diameterCss + "px";
    brushCursor.style.height = diameterCss + "px";
  }

  function moveCursor(clientX, clientY) {
    brushCursor.style.left = clientX + "px";
    brushCursor.style.top = clientY + "px";
  }

  function showCursor() {
    updateCursorSize();
    brushCursor.style.display = "block";
  }

  function hideCursor() {
    brushCursor.style.display = "none";
  }

  function pointFromClient(clientX, clientY) {
    var rect = displayCanvas.getBoundingClientRect();
    var xRatio = displayCanvas.width / rect.width;
    var yRatio = displayCanvas.height / rect.height;
    return {
      x: (clientX - rect.left) * xRatio,
      y: (clientY - rect.top) * yRatio,
    };
  }

  function pointFromEvent(evt) {
    var clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    var clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
    return pointFromClient(clientX, clientY);
  }

  function renderDisplay() {
    // Full redraw rather than incremental blending — drawImage covers
    // every pixel (displayCanvas is sized exactly to match), so this
    // discards whatever alpha-blended history was on the visible canvas
    // and rebuilds it from the source image plus the current overlay at
    // one flat opacity, every time.
    displayCtx.drawImage(image, 0, 0, displayCanvas.width, displayCanvas.height);
    displayCtx.save();
    displayCtx.globalAlpha = BRUSH_OPACITY;
    displayCtx.drawImage(overlayCanvas, 0, 0);
    displayCtx.restore();
  }

  // Pure pixel drawing, no recording and no redraw of its own — the one
  // low-level primitive both live drawing (`paintAt`, which records the dab
  // and repaints immediately for per-dab feedback) and undo/redo replay
  // (`applyAction`, which fires many dabs back-to-back and repaints once at
  // the end) funnel through, so the two can never draw a dab differently.
  function applyDab(x, y, radius, erase) {
    if (erase) {
      overlayCtx.save();
      overlayCtx.globalCompositeOperation = "destination-out";
      overlayCtx.beginPath();
      overlayCtx.arc(x, y, radius, 0, Math.PI * 2);
      overlayCtx.fill();
      overlayCtx.restore();

      maskCtx.beginPath();
      maskCtx.fillStyle = "#000";
      maskCtx.arc(x * scale, y * scale, radius * scale, 0, Math.PI * 2);
      maskCtx.fill();
    } else {
      overlayCtx.beginPath();
      overlayCtx.fillStyle = "#ff2d2d";
      overlayCtx.arc(x, y, radius, 0, Math.PI * 2);
      overlayCtx.fill();

      maskCtx.beginPath();
      maskCtx.fillStyle = "#fff";
      maskCtx.arc(x * scale, y * scale, radius * scale, 0, Math.PI * 2);
      maskCtx.fill();
    }
  }

  function paintAt(x, y) {
    lastPaintPoint = { x: x, y: y };
    var radius = brushDiameter() / 2;
    var erase = erasing !== invertStroke;
    applyDab(x, y, radius, erase);
    // `beginStroke`/`paintLineTo` always open `currentAction` before the
    // first call here, so this is really unconditional in practice — the
    // guard just keeps `paintAt` safe to call on its own without also
    // requiring an open action.
    if (currentAction) currentAction.dabs.push({ x: x, y: y, radius: radius, erase: erase });
    renderDisplay();
  }

  function resetMask() {
    maskCtx.fillStyle = "#000";
    maskCtx.fillRect(0, 0, maskCanvas.width, maskCanvas.height);
    overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
    lastPaintPoint = null;
    renderDisplay();
  }

  // The "Clear" button, as opposed to `resetMask` itself — which is also
  // used internally (initial setup in `loadImage`, and to rebuild from
  // scratch during undo/redo replay) where wiping the canvas must *not*
  // itself become another undoable action.
  function clearMask() {
    resetMask();
    commitAction({ type: "clear" });
  }

  function beginStroke(x, y) {
    drawing = true;
    currentAction = { type: "stroke", dabs: [] };
    paintAt(x, y);
  }

  function continueStroke(x, y) {
    if (!drawing) return;
    paintAt(x, y);
  }

  // Shift-click straight line: dabs stepped along the segment from
  // `lastPaintPoint` to (x, y), close enough together to look like a single
  // continuous stroke (same spacing idea as a real brush engine) rather
  // than a dashed line of separate circles. Not a "stroke" in the
  // `drawing`/`beginStroke` sense — it's one discrete click, not a drag —
  // so it commits its own action afterward instead of relying on
  // `endStroke`, the same one-shot-then-flood-fill-then-commit shape a
  // freehand stroke gets.
  function paintLineTo(x, y) {
    var displayRadius = brushDiameter() / 2;
    var from = lastPaintPoint;
    var dx = x - from.x;
    var dy = y - from.y;
    var dist = Math.hypot(dx, dy);
    var steps = Math.max(1, Math.ceil(dist / Math.max(1, displayRadius * 0.35)));
    currentAction = { type: "line", dabs: [] };
    for (var i = 1; i <= steps; i++) {
      var t = i / steps;
      paintAt(from.x + dx * t, from.y + dy * t);
    }
    finishAction();
  }

  // Runs the enclosed-area auto-fill (if enabled) and commits whatever
  // dabs `currentAction` accumulated as one undoable action — shared by
  // `endStroke` (a freehand drag) and `paintLineTo` (a shift-click line),
  // the two ways a "stroke" of dabs can complete.
  function finishAction() {
    var action = currentAction;
    currentAction = null;
    invertStroke = false;
    // Can be empty if every dab this action would have recorded was
    // rolled back by `undoRevocableDab` (a touch that turned out to be the
    // first finger of a pinch, not a tap) — nothing actually changed, so
    // there's nothing to fill and no reason to clutter undo history with a
    // no-op entry.
    if (!action || !action.dabs.length) return;
    action.fill = autoFillEnabled;
    if (action.fill) runEnclosedFill();
    commitAction(action);
  }

  function endStroke() {
    // Guards against the several call sites (`onPointerUp`, `startPan`
    // ending a stroke pre-emptively, ...) that call this even when nothing
    // was actually being drawn — without it, every one of those would
    // trigger a needless flood-fill pass and a phantom undo entry.
    if (!drawing) return;
    drawing = false;
    finishAction();
    syncCursorMode(false);
  }

  // Flood fill from every edge cell of a `painted` grid (1 = wall,
  // 0 = open), 4-directionally, using an explicit array-backed queue
  // (never recursion — `w * h` can be up to `FILL_DETECT_MAX_DIM`
  // squared, well past what the call stack could take one frame per
  // cell). Returns a same-size `reachable` grid: 1 for every open cell the
  // fill actually reached from an edge. Any open cell *not* set in the
  // result was walled off from every edge — i.e. enclosed by painted
  // pixels — which is exactly what "closing a loop" means here.
  //
  // `borderWall` (defaults to `painted` itself) is a separate, optionally
  // more lenient wall check used *only* to decide whether a literal
  // border-ring cell counts as an open door to the outside — every other
  // wall check, including all interior propagation once the fill is
  // already inside the grid, always uses the real `painted` unchanged. See
  // `runEnclosedFill`'s call site for why a straight `painted` check on the
  // border specifically under-detects a stroke drawn right up against the
  // image edge.
  function floodFillFromBorder(painted, w, h, borderWall) {
    borderWall = borderWall || painted;
    var reachable = new Uint8Array(w * h);
    var queue = new Int32Array(w * h);
    var qTail = 0;

    function trySeed(idx) {
      if (!borderWall[idx] && !reachable[idx]) {
        reachable[idx] = 1;
        queue[qTail++] = idx;
      }
    }

    function tryPush(idx) {
      if (!painted[idx] && !reachable[idx]) {
        reachable[idx] = 1;
        queue[qTail++] = idx;
      }
    }

    for (var x = 0; x < w; x++) {
      trySeed(x);
      trySeed((h - 1) * w + x);
    }
    for (var y = 0; y < h; y++) {
      trySeed(y * w);
      trySeed(y * w + (w - 1));
    }

    var qHead = 0;
    while (qHead < qTail) {
      var idx = queue[qHead++];
      var cx = idx % w;
      var cy = (idx - cx) / w;
      if (cx > 0) tryPush(idx - 1);
      if (cx < w - 1) tryPush(idx + 1);
      if (cy > 0) tryPush(idx - w);
      if (cy < h - 1) tryPush(idx + w);
    }

    return reachable;
  }

  // Grows `mask` by one cell in every 4-connected direction (a single
  // morphological dilation pass). `runEnclosedFill` runs this a couple of
  // times over the enclosed region it finds before upscaling it,
  // because that region is defined as everything the flood fill *didn't*
  // reach — which by construction stops one cell short of the stroke
  // itself (the stroke is the wall the fill got blocked by, not part of
  // the open area). Left ungrown, upscaling that shape back onto the
  // full-resolution canvases would land its edge a little inside the
  // stroke's own inner edge instead of under it, leaving a thin ring of
  // bare source image visible between the two. Growing first means the
  // upscaled fill overlaps the stroke instead of just meeting it — outside
  // the loop entirely (past the two or so cells' width this eats into
  // "reachable from edge" territory) has no wall to grow into and is
  // unaffected.
  function dilate(mask, w, h) {
    var grown = new Uint8Array(mask.length);
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var idx = y * w + x;
        if (
          mask[idx] ||
          (x > 0 && mask[idx - 1]) ||
          (x < w - 1 && mask[idx + 1]) ||
          (y > 0 && mask[idx - w]) ||
          (y < h - 1 && mask[idx + w])
        ) {
          grown[idx] = 1;
        }
      }
    }
    return grown;
  }
  var FILL_GROW_PASSES = 2;

  // Runs after every completed stroke (paint or erase), when auto-fill is
  // enabled — gated by callers (`finishAction`, and undo/redo's replay of a
  // past action via `applyAction`), not here, so replay can reproduce
  // exactly what fired historically even if the button's been toggled
  // since. Downscales the current selection highlight into
  // `fillDetectCanvas`, flood-fills it from the edges, and paints solid
  // fill into any pocket that turned out enclosed — the "grab a closed
  // circle, its interior fills in too" feature. Erasing part of an
  // already-filled loop's boundary does *not* retroactively un-fill its
  // interior (this only ever adds paint, same as an ordinary brush dab
  // would) — the eraser still works on that interior directly if that's
  // ever needed.
  function runEnclosedFill() {
    var detectScale = Math.min(
      1,
      FILL_DETECT_MAX_DIM / Math.max(overlayCanvas.width, overlayCanvas.height)
    );
    var w = Math.max(1, Math.round(overlayCanvas.width * detectScale));
    var h = Math.max(1, Math.round(overlayCanvas.height * detectScale));
    fillDetectCanvas.width = w;
    fillDetectCanvas.height = h;
    fillDetectCtx.clearRect(0, 0, w, h);
    fillDetectCtx.drawImage(overlayCanvas, 0, 0, w, h);

    var alpha = fillDetectCtx.getImageData(0, 0, w, h).data;
    var painted = new Uint8Array(w * h);
    for (var i = 0; i < painted.length; i++) {
      painted[i] = alpha[i * 4 + 3] > FILL_ALPHA_THRESHOLD ? 1 : 0;
    }

    // floodFillFromBorder seeds *every* unpainted cell on all four edges as
    // "reachable from outside" — so a pocket the user means to seal against
    // the image edge only actually gets sealed if every single
    // detection-grid cell along that edge reads as painted. A stroke drawn
    // right up to the image boundary routinely falls short of that: a round
    // brush centered exactly on the edge is geometrically half-clipped by
    // the canvas bounds, so its actual coverage there is only about half of
    // what the same stroke gets in the interior — and downscaling that
    // already-thin coverage into fillDetectCanvas (softening it further,
    // the same way scaling down any image blurs its edges) can easily pull
    // it under FILL_ALPHA_THRESHOLD even though the full-resolution stroke
    // looks solid. One flood fill then leaks in through that gap and the
    // whole pocket reads as "reachable", not enclosed — this is what
    // surfaces to the user as "the outermost row of pixels isn't
    // selectable" via auto-fill.
    //
    // The fix is *not* to flood-fill against a globally dilated wall —
    // that would also wall off, and therefore spuriously enclose, a thin
    // halo around every ordinary stroke everywhere, not just near the
    // edge. Only the border-seeding decision needs the leniency: a border
    // cell counts as walled off (not an open door) if it *or an immediate
    // neighbor* is painted, while every other wall check — all interior
    // propagation, including the very next cell in from the border — still
    // uses the real, undilated `painted`, so open space elsewhere behaves
    // exactly as before.
    var reachableFromEdge = floodFillFromBorder(painted, w, h, dilate(painted, w, h));

    var enclosed = new Uint8Array(w * h);
    var foundAny = false;
    for (var j = 0; j < painted.length; j++) {
      if (painted[j] || reachableFromEdge[j]) continue;
      enclosed[j] = 1;
      foundAny = true;
    }
    if (!foundAny) return;
    for (var pass = 0; pass < FILL_GROW_PASSES; pass++) {
      enclosed = dilate(enclosed, w, h);
    }

    var maskFill = new ImageData(w, h);
    var overlayFill = new ImageData(w, h);
    for (var j = 0; j < enclosed.length; j++) {
      if (!enclosed[j]) continue;
      var o = j * 4;
      maskFill.data[o] = 255;
      maskFill.data[o + 1] = 255;
      maskFill.data[o + 2] = 255;
      maskFill.data[o + 3] = 255;
      overlayFill.data[o] = 255;
      overlayFill.data[o + 1] = 45;
      overlayFill.data[o + 2] = 45;
      overlayFill.data[o + 3] = 255;
    }

    fillShapeCanvas.width = w;
    fillShapeCanvas.height = h;

    fillShapeCtx.putImageData(maskFill, 0, 0);
    maskCtx.drawImage(fillShapeCanvas, 0, 0, maskCanvas.width, maskCanvas.height);

    fillShapeCtx.putImageData(overlayFill, 0, 0);
    overlayCtx.drawImage(fillShapeCanvas, 0, 0, overlayCanvas.width, overlayCanvas.height);

    renderDisplay();
  }

  // Middle- or right-button drag pans instead of drawing — desktop's
  // equivalent of the second-finger pinch/pan below, for a mouse that only
  // ever has one point of contact. `setPointerCapture` keeps `pointermove`
  // targeting `displayCanvas` even once the drag crosses outside its
  // bounds (routine when panning a zoomed-in image toward its edge), the
  // same way an ordinary left-button stroke already relies on `pointerup`
  // being bound to `window` rather than the canvas for the same reason.
  var panState = null;

  function startPan(evt) {
    // A chorded second button (e.g. right-click while still mid-stroke
    // from an earlier left-button press) ends that stroke rather than
    // drawing and panning at once.
    endStroke();
    hideCursor();
    panState = { startX: evt.clientX, startY: evt.clientY, startTx: view.tx, startTy: view.ty };
    try {
      displayCanvas.setPointerCapture(evt.pointerId);
    } catch (e) {
      // Unsupported in some embedded WebViews — panning still works, it
      // just won't track past the canvas's own edge.
    }
  }

  function updatePan(evt) {
    view.tx = panState.startTx + (evt.clientX - panState.startX);
    view.ty = panState.startTy + (evt.clientY - panState.startY);
    applyView();
  }

  // Mouse/pen only below — touch is handled entirely separately
  // (`handleTouchStart`/`Move`/`End`), since a pinch needs the full
  // `evt.touches` list a single-pointer Pointer Event can't give it (each
  // finger is its own independent pointer). Without this guard, a
  // touchscreen would fire *both* a Pointer Event and a Touch Event per
  // finger, double-handling every tap — harmless for one finger (same
  // coordinates twice), but wrong for two, since the second finger's own
  // pointerdown/pointermove would start an ordinary paint stroke right
  // where the pinch code is deliberately suppressing one.
  function onPointerDown(evt) {
    if (evt.pointerType === "touch") return;
    evt.preventDefault();
    if (panState) return; // already panning on another button — ignore the rest of the chord
    if (evt.button === 1 || evt.button === 2) {
      startPan(evt);
      return;
    }
    if (evt.button !== 0 || drawing) return;
    moveCursor(evt.clientX, evt.clientY);
    showCursor();
    var p = pointFromEvent(evt);
    invertStroke = evt.altKey;
    if (evt.shiftKey && lastPaintPoint) {
      paintLineTo(p.x, p.y);
      return;
    }
    beginStroke(p.x, p.y);
  }

  function onPointerMove(evt) {
    if (evt.pointerType === "touch") return;
    evt.preventDefault();
    if (panState) {
      updatePan(evt);
      return;
    }
    moveCursor(evt.clientX, evt.clientY);
    var p = pointFromEvent(evt);
    continueStroke(p.x, p.y);
  }

  function onPointerUp(evt) {
    if (evt.pointerType === "touch") return;
    if (panState) {
      panState = null;
      return;
    }
    endStroke();
  }

  displayCanvas.addEventListener("pointerdown", onPointerDown);
  displayCanvas.addEventListener("pointermove", onPointerMove);
  window.addEventListener("pointerup", onPointerUp);
  displayCanvas.addEventListener("pointerenter", function (evt) {
    if (evt.pointerType === "touch") return;
    showCursor();
  });
  displayCanvas.addEventListener("pointerleave", function (evt) {
    if (evt.pointerType === "touch") return;
    hideCursor();
  });
  // Right-button drag pans (above) rather than opening the browser's
  // context menu.
  displayCanvas.addEventListener("contextmenu", function (evt) {
    evt.preventDefault();
  });

  // One finger draws; a second finger switches to pinch-zoom/pan for the
  // rest of the gesture (`multiTouchActive` latches until every finger is
  // lifted, so dropping back to one finger mid-pinch can't be mistaken
  // for the start of a new stroke).
  function undoRevocableDab() {
    if (!pendingTouch) return;
    restoreBrushRegion(overlayCtx, pendingTouch.overlaySnap);
    restoreBrushRegion(maskCtx, pendingTouch.maskSnap);
    // The pixel revert above must be mirrored in the action log, or
    // `finishAction` would later commit — and undo/redo would later
    // replay — a dab that was never actually left on the canvas. This is
    // always exactly the one dab `beginStroke` just recorded a moment ago
    // (nothing else can have run in between: `handleTouchMove` never calls
    // `continueStroke` while `pendingTouch` is still set).
    if (currentAction && currentAction.dabs.length) currentAction.dabs.pop();
    renderDisplay();
    cancelPendingTouch();
  }

  function handleTouchStart(evt) {
    if (evt.touches.length >= 2) {
      evt.preventDefault();
      // A second finger arriving while the first dab is still revocable
      // means this was a pinch all along — undo it so the net result is
      // exactly as if both fingers had landed together.
      undoRevocableDab();
      multiTouchActive = true;
      endStroke();
      hideCursor();
      startPinch(evt.touches[0], evt.touches[1]);
      return;
    }
    if (multiTouchActive) return;
    evt.preventDefault();
    var t = evt.touches[0];
    moveCursor(t.clientX, t.clientY);
    showCursor();
    var p = pointFromClient(t.clientX, t.clientY);
    var displayRadius = brushDiameter() / 2;
    var overlaySnap = snapshotBrushRegion(overlayCtx, p.x, p.y, displayRadius);
    var maskSnap = snapshotBrushRegion(maskCtx, p.x * scale, p.y * scale, displayRadius * scale);
    beginStroke(p.x, p.y);
    pendingTouch = {
      // The touch's own starting position, in raw screen pixels — what
      // `exceedsTouchSlop` measures ongoing movement against.
      clientX: t.clientX,
      clientY: t.clientY,
      overlaySnap: overlaySnap,
      maskSnap: maskSnap,
      timer: setTimeout(function () {
        pendingTouch = null; // window passed with no second finger — the dab stands
      }, PINCH_DETECT_DELAY_MS),
    };
  }

  function handleTouchMove(evt) {
    if (evt.touches.length >= 2) {
      evt.preventDefault();
      undoRevocableDab();
      updatePinch(evt.touches[0], evt.touches[1]);
      return;
    }
    if (multiTouchActive) return;
    evt.preventDefault();
    var t = evt.touches[0];
    moveCursor(t.clientX, t.clientY);
    if (
      pendingTouch &&
      !exceedsTouchSlop(t.clientX, t.clientY, pendingTouch.clientX, pendingTouch.clientY)
    ) {
      // Still within natural finger tremor for a held-still touch — not
      // yet a deliberate drag, so leave the dab revocable rather than
      // confirming it (and don't bother repainting on top of it either,
      // since this hasn't moved anywhere meaningful yet).
      return;
    }
    // Either genuinely moved past the dead zone (a real drag — the
    // initial dab is no longer revocable past this point, even if a
    // second finger shows up later) or there was no pending dab to
    // reconsider in the first place.
    cancelPendingTouch();
    var p = pointFromClient(t.clientX, t.clientY);
    continueStroke(p.x, p.y);
  }

  function handleTouchEnd(evt) {
    if (evt.touches.length === 0) {
      // Released without a second finger ever showing up — the dab was
      // never undone, so it just stands as-is; nothing to do here beyond
      // stopping the now-moot timer.
      cancelPendingTouch();
      multiTouchActive = false;
      pinch = null;
      hideCursor();
      endStroke();
    } else if (evt.touches.length === 1) {
      // Dropped from two fingers to one — the pinch is over, but stay
      // latched in `multiTouchActive` until that last finger lifts too.
      pinch = null;
    }
  }

  displayCanvas.addEventListener("touchstart", handleTouchStart, { passive: false });
  displayCanvas.addEventListener("touchmove", handleTouchMove, { passive: false });
  window.addEventListener("touchend", handleTouchEnd);
  window.addEventListener("touchcancel", handleTouchEnd);

  brushSizeInput.addEventListener("input", updateCursorSize);
  window.addEventListener("resize", updateCursorSize);

  clearBtn.addEventListener("click", clearMask);

  // Same on/off-color pattern as `#autofill-btn` — the label itself never
  // changes ("🧹 Erase" always names the button, not the current mode), only
  // `.active` toggles, so the button's width never changes either. It used
  // to relabel itself to "🖌️ Brush" while erasing, which read fine on its
  // own but meant the button (and undo/redo after it in this same flex row)
  // visibly jumped width on every toggle.
  eraseBtn.addEventListener("click", function () {
    erasing = !erasing;
    eraseBtn.classList.toggle("active", erasing);
    syncCursorMode(false);
  });

  // The cursor previews what the *next* dab will do, so holding Alt flips
  // it the same way Alt+click flips the stroke (see `invertStroke`).
  // Mid-stroke it keeps showing the latched mode instead of tracking the
  // key. The button itself stays on the toggle's real state, since Alt is
  // only a momentary override.
  function syncCursorMode(altHeld) {
    var invert = drawing ? invertStroke : altHeld;
    brushCursor.classList.toggle("erasing", erasing !== invert);
  }

  function onAltKey(evt) {
    if (evt.key !== "Alt") return;
    syncCursorMode(evt.type === "keydown");
    // A bare Alt release focuses the menu bar in some browsers (Firefox,
    // most things on Windows), which would swallow the next keystroke.
    var tag = evt.target && evt.target.tagName;
    if (tag !== "TEXTAREA" && tag !== "INPUT") evt.preventDefault();
  }
  window.addEventListener("keydown", onAltKey);
  window.addEventListener("keyup", onAltKey);
  // Alt released while the window was unfocused never sends a keyup here.
  window.addEventListener("blur", function () {
    syncCursorMode(false);
  });
  displayCanvas.addEventListener("pointermove", function (evt) {
    if (evt.pointerType !== "touch") syncCursorMode(evt.altKey);
  });

  undoBtn.addEventListener("click", undo);
  redoBtn.addEventListener("click", redo);

  // Ctrl/Cmd+Z to undo, Ctrl/Cmd+Shift+Z or Ctrl/Cmd+Y to redo — the usual
  // desktop-app bindings (not Ctrl+V, which is paste everywhere else on the
  // page, including straight into the "✏️ Detail Prompt" textareas below).
  // Skipped entirely while a textarea/input has focus so those keep their
  // own native undo instead of the mask's.
  window.addEventListener("keydown", function (evt) {
    var tag = evt.target && evt.target.tagName;
    if (tag === "TEXTAREA" || tag === "INPUT") return;
    if (!(evt.ctrlKey || evt.metaKey)) return;
    var key = evt.key.toLowerCase();
    if (key === "z") {
      evt.preventDefault();
      if (evt.shiftKey) redo();
      else undo();
    } else if (key === "y") {
      evt.preventDefault();
      redo();
    }
  });

  // `promptFieldsEnabled` is set once, from `GET /jobs/{token}/meta`
  // (`applyMeta`, below) before the image even starts loading — it decides
  // both whether `#prompt-fields` is shown at all and whether "Done"
  // includes them in its submission.
  var promptFieldsEnabled = false;
  // Set once, from `GET /jobs/{token}/meta` (`applyMeta`, below) — unlike
  // `promptFieldsEnabled` this isn't tied to `mode`, since the LoRA toggle
  // is relevant to a plain "mask" job ("🖌️ Draw Mask") too, not just
  // "mask_prompt" ("✏️ Detail Prompt").
  var loraAvailable = false;

  doneBtn.addEventListener("click", function () {
    doneBtn.disabled = true;
    doneBtn.textContent = "Sending…";
    maskCanvas.toBlob(function (blob) {
      var form = new FormData();
      form.append("mask", blob, "mask.png");
      form.append("init_data", tg ? tg.initData : "");
      if (loraAvailable) {
        form.append("detailer_disable_lora", loraToggle.checked ? "true" : "false");
      }
      if (promptFieldsEnabled) {
        form.append("positive", positiveInput.value);
        form.append("negative", negativeInput.value);
        form.append("denoise", denoiseOverride.checked ? denoiseInput.value : "");
        // Always an explicit "true"/"false", unlike the three above — a
        // checkbox has no blank "no override" state to fall back to the
        // profile's own default with, so whatever it's currently showing
        // is exactly what gets submitted.
        form.append("tile_controlnet", tileControlnetToggle.checked ? "true" : "false");
      }
      fetch("/jobs/" + encodeURIComponent(token) + "/mask", {
        method: "POST",
        body: form,
      })
        .then(function (resp) {
          if (!resp.ok) throw new Error("Upload failed: " + resp.status);
          setStatus("Sent — you can close this.");
          if (tg) {
            tg.close();
          }
        })
        .catch(function (err) {
          setStatus("Couldn't send the mask (" + err.message + ") — try again.");
          doneBtn.disabled = false;
          doneBtn.textContent = "Done";
        });
    }, "image/png");
  });

  // `meta.readonly` (see handlers.py's `_detail_prompt_readonly_info`) is
  // a single flat dict — unlike the old per-image override this replaced,
  // the run that follows is always the one detailer "✏️ Detail Prompt"
  // uses, not a later choice, so there's nothing to key it by.
  function formatReadonlyInfo(info) {
    if (!info || typeof info.steps === "undefined") return "";
    return (
      "Detailing settings: steps " + info.steps +
      ", cfg " + info.cfg +
      ", " + info.sampler_name + "/" + info.scheduler +
      " (default denoise " + info.denoise + ")"
    );
  }

  function updateDenoiseReadout() {
    denoiseValueEl.textContent = denoiseOverride.checked
      ? Number(denoiseInput.value).toFixed(2)
      : "detailer default";
  }

  // Whether to show `#prompt-fields` at all is decided server-side, at job
  // creation (`Job.mode` — see inpaint_relay/server.py), not guessed from
  // anything client-side.
  function applyMeta(meta) {
    // Both checked up front, before the mode-gated early return below —
    // `tile_controlnet_available` is only ever true for a "mask_prompt"
    // job anyway (the relay only sets it then), but checking it here
    // rather than after the early return is what lets both checkboxes
    // share one row regardless of which one(s) end up shown.
    var toggleShown = false;
    if (meta.detailer_disable_lora_available) {
      loraAvailable = true;
      loraRow.style.display = "flex";
      loraToggle.checked = Boolean(meta.detailer_disable_lora_default);
      toggleShown = true;
    }
    // Hidden entirely (not shown-but-disabled) when this checkpoint's
    // profile has no tile_controlnet staged at all — there'd be nothing
    // for the checkbox to actually turn on either way. When it is shown,
    // it starts checked/unchecked from the profile's own current default
    // (`ModelProfile.detail_prompt_tile_controlnet`) but is always
    // submitted as its own explicit value on "Done" regardless of that
    // starting point.
    if (meta.tile_controlnet_available) {
      tileControlnetRow.style.display = "flex";
      tileControlnetToggle.checked = Boolean(meta.tile_controlnet_default);
      toggleShown = true;
    }
    if (toggleShown) {
      toggleRowEl.style.display = "flex";
    }
    if (meta.mode !== "mask_prompt") return;
    promptFieldsEnabled = true;
    document.title = "Detail prompt";
    promptFieldsEl.style.display = "flex";
    readonlyEl.textContent = formatReadonlyInfo(meta.readonly);
    // Pre-filled with this image's own current prompt — the usual reason
    // to open this is to cut a scene-wide prompt down to what the marked
    // region needs, not type one from scratch. Denoise has no equivalent
    // "current" value to start from (each detailer has its own fixed
    // default), so its override checkbox starts unchecked regardless.
    positiveInput.value = meta.positive || "";
    negativeInput.value = meta.negative || "";
    references = Array.isArray(meta.references) ? meta.references : [];
    if (references.length) {
      document.getElementById("positive-hint").textContent =
        "— type $ for characters and favorites";
    }
    denoiseOverride.addEventListener("change", function () {
      denoiseInput.disabled = !denoiseOverride.checked;
      updateDenoiseReadout();
    });
    denoiseInput.addEventListener("input", updateDenoiseReadout);
  }

  // Collapsed/expanded is remembered per viewer (it's a layout preference,
  // not job state). With nothing stored yet, a touch device starts
  // collapsed — that's where the panel crowds the canvas — and anything
  // with a mouse starts expanded. Deliberately not a width breakpoint:
  // Telegram Desktop opens WebApps in a narrow window too.
  var OPTIONS_COLLAPSED_KEY = "optionsCollapsed";

  function initialOptionsCollapsed() {
    try {
      var stored = localStorage.getItem(OPTIONS_COLLAPSED_KEY);
      if (stored === "1") return true;
      if (stored === "0") return false;
    } catch (e) {
      // Storage blocked — fall through to the device default.
    }
    return window.matchMedia("(pointer: coarse)").matches;
  }

  // One-line recap shown in the header while collapsed, so what "Done"
  // will submit is still visible without unfolding the panel. Only
  // recomputed on collapse — nothing in the panel can change while it's
  // folded away.
  function updateOptionsSummary() {
    var parts = [];
    if (promptFieldsEnabled) {
      if (positiveInput.value.trim()) parts.push(positiveInput.value.trim());
      if (denoiseOverride.checked) {
        parts.push("denoise " + Number(denoiseInput.value).toFixed(2));
      }
      if (tileControlnetToggle.checked) parts.push("tile CN");
    }
    if (loraAvailable && loraToggle.checked) parts.push("no LoRAs");
    optionsSummary.textContent = parts.join(" · ");
  }

  function setOptionsCollapsed(collapsed) {
    if (collapsed) updateOptionsSummary();
    optionsPanel.classList.toggle("collapsed", collapsed);
    optionsToggle.setAttribute("aria-expanded", String(!collapsed));
  }

  optionsToggle.addEventListener("click", function () {
    var collapsed = !optionsPanel.classList.contains("collapsed");
    setOptionsCollapsed(collapsed);
    try {
      localStorage.setItem(OPTIONS_COLLAPSED_KEY, collapsed ? "1" : "0");
    } catch (e) {
      // Not remembered this time — harmless.
    }
  });

  // Runs after `applyMeta`, so it knows whether either child has anything
  // to show — a plain "mask" job with no LoRA toggle gets no panel at all.
  function initOptionsPanel() {
    var hasToggles = toggleRowEl.style.display === "flex";
    if (!promptFieldsEnabled && !hasToggles) return;
    optionsTitle.textContent = promptFieldsEnabled ? "Prompt & options" : "Options";
    optionsPanel.style.display = "block";
    setOptionsCollapsed(initialOptionsCollapsed());
  }

  function loadImage() {
    image.onload = function () {
      // The display canvas's own pixel buffer is capped so the mask editor
      // stays responsive on a large source image — it's just for drawing,
      // not the final output, and `scale` maps every stroke back up to
      // maskCanvas's full source-image resolution regardless of this cap.
      // The cap used to be a flat 900px, which meant a 4k source image sat
      // roughly 4.5x downscaled even at rest — and since pinch/wheel zoom
      // (`view.zoom`, up to MAX_ZOOM) is a CSS `transform: scale()` applied
      // on top of that same fixed raster rather than a redraw at higher
      // detail, zooming in just stretched those same soft pixels further and
      // went blocky fast. Sizing the cap off the actual viewport instead
      // (times device pixel ratio, times MAX_ZOOM) gives the raster enough
      // real detail to stay crisp all the way to full pinch zoom on whatever
      // screen this happens to be open on, while still bounding memory/redraw
      // cost on a small phone screen the same way the old flat cap did.
      var viewportPxAtMaxZoom =
        Math.max(canvasWrap.clientWidth, canvasWrap.clientHeight) *
        (window.devicePixelRatio || 1) *
        MAX_ZOOM;
      var maxDisplayDim = Math.min(4096, Math.max(900, viewportPxAtMaxZoom));
      var displayScale = Math.min(
        1,
        maxDisplayDim / Math.max(image.naturalWidth, image.naturalHeight)
      );
      displayCanvas.width = Math.round(image.naturalWidth * displayScale);
      displayCanvas.height = Math.round(image.naturalHeight * displayScale);
      overlayCanvas.width = displayCanvas.width;
      overlayCanvas.height = displayCanvas.height;
      maskCanvas.width = image.naturalWidth;
      maskCanvas.height = image.naturalHeight;
      scale = image.naturalWidth / displayCanvas.width;

      resetMask();
      setStatus(
        promptFieldsEnabled
          ? "Draw over the region to detail, describe it below, then tap Done."
          : "Draw over the area to fix, then tap Done."
      );
    };
    image.onerror = function () {
      setStatus("Couldn't load the image — this link may have expired.");
      doneBtn.disabled = true;
      clearBtn.disabled = true;
    };
    image.src = "/jobs/" + encodeURIComponent(token) + "/image";
  }

  // `$name` autocomplete for the prompt fields. `references` (from
  // `meta.references`) is the chat's saved characters plus this user's
  // favorites — comfytelegram expands the `$name`s when the submission
  // comes back, so this only helps type a name that exists. Typing `$`
  // (or `$ab`) at the caret opens a menu of matching names, prefix matches
  // first; tapping one (or Enter/Tab) replaces the partial name.
  var references = [];
  var refMenu = document.getElementById("ref-menu");
  var refState = null; // {input, start, end, items, index} while open

  function refQueryAt(input) {
    if (input.selectionStart !== input.selectionEnd) return null;
    var caret = input.selectionStart;
    var match = /(^|[^\w$])\$([A-Za-z0-9_-]*)$/.exec(input.value.slice(0, caret));
    if (!match) return null;
    return { start: caret - match[2].length - 1, end: caret, query: match[2].toLowerCase() };
  }

  function matchingReferences(query) {
    var prefix = [];
    var inner = [];
    references.forEach(function (ref) {
      var name = ref.name.toLowerCase();
      if (name.indexOf(query) === 0) prefix.push(ref);
      else if (query && name.indexOf(query) > 0) inner.push(ref);
    });
    return prefix.concat(inner);
  }

  function closeRefMenu() {
    refState = null;
    refMenu.style.display = "none";
  }

  function placeRefMenu() {
    var rect = refState.input.getBoundingClientRect();
    var viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    var above = rect.top;
    var below = viewportHeight - rect.bottom;
    refMenu.style.left = rect.left + "px";
    refMenu.style.width = rect.width + "px";
    if (above >= below) {
      refMenu.style.top = "auto";
      refMenu.style.bottom = window.innerHeight - rect.top + 4 + "px";
      refMenu.style.maxHeight = Math.max(80, Math.min(240, above - 8)) + "px";
    } else {
      refMenu.style.bottom = "auto";
      refMenu.style.top = rect.bottom + 4 + "px";
      refMenu.style.maxHeight = Math.max(80, Math.min(240, below - 8)) + "px";
    }
  }

  function renderRefMenu() {
    refMenu.textContent = "";
    refState.items.forEach(function (ref, i) {
      var item = document.createElement("div");
      item.className = "ref-item" + (i === refState.index ? " active" : "");
      item.setAttribute("role", "option");
      var name = document.createElement("span");
      name.className = "ref-name";
      name.textContent = (ref.kind === "character" ? "👤 $" : "⭐ $") + ref.name;
      var preview = document.createElement("span");
      preview.className = "ref-preview";
      preview.textContent = ref.preview || "";
      item.appendChild(name);
      item.appendChild(preview);
      // pointerdown + preventDefault keeps focus (and the on-screen
      // keyboard) on the textarea; a click would blur it first.
      item.addEventListener("pointerdown", function (evt) {
        evt.preventDefault();
        pickReference(i);
      });
      refMenu.appendChild(item);
    });
    refMenu.style.display = "block";
    placeRefMenu();
    var active = refMenu.children[refState.index];
    if (active) active.scrollIntoView({ block: "nearest" });
  }

  function updateRefMenu(input) {
    if (!references.length) return;
    var query = refQueryAt(input);
    var items = query ? matchingReferences(query.query) : [];
    if (!items.length) {
      closeRefMenu();
      return;
    }
    refState = { input: input, start: query.start, end: query.end, items: items, index: 0 };
    renderRefMenu();
  }

  function pickReference(i) {
    var input = refState.input;
    var insert = "$" + refState.items[i].name;
    input.value = input.value.slice(0, refState.start) + insert + input.value.slice(refState.end);
    var caret = refState.start + insert.length;
    input.setSelectionRange(caret, caret);
    closeRefMenu();
    input.focus();
  }

  [positiveInput, negativeInput].forEach(function (input) {
    input.addEventListener("input", function () { updateRefMenu(input); });
    input.addEventListener("click", function () { updateRefMenu(input); });
    input.addEventListener("blur", closeRefMenu);
    input.addEventListener("keydown", function (evt) {
      if (!refState || refState.input !== input) return;
      if (evt.key === "ArrowDown" || evt.key === "ArrowUp") {
        var step = evt.key === "ArrowDown" ? 1 : -1;
        var count = refState.items.length;
        refState.index = (refState.index + step + count) % count;
        renderRefMenu();
      } else if (evt.key === "Enter" || evt.key === "Tab") {
        pickReference(refState.index);
      } else if (evt.key === "Escape") {
        closeRefMenu();
      } else {
        return;
      }
      evt.preventDefault();
      evt.stopPropagation();
    });
  });
  promptFieldsEl.addEventListener("scroll", function () {
    if (refState) placeRefMenu();
  });
  window.addEventListener("resize", function () {
    if (refState) placeRefMenu();
  });

  fetch("/jobs/" + encodeURIComponent(token) + "/meta")
    .then(function (resp) {
      if (!resp.ok) throw new Error("meta fetch failed: " + resp.status);
      return resp.json();
    })
    .then(function (meta) {
      applyMeta(meta);
      initOptionsPanel();
      loadImage();
    })
    .catch(function () {
      setStatus("Couldn't load this job — the link may have expired.");
    });
})();
</script>
</body>
</html>
