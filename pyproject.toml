[project]
name = "comfytelegram"
version = "0.1.0"
description = "Telegram bot front-end for a local ComfyUI installation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.3",
    "jsonschema>=4.26.0",
    "numpy>=2.4.6",
    "onnxruntime>=1.29.0",
    "pillow>=12.3.0",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "python-telegram-bot>=22.8",
]

[project.scripts]
comfytelegram = "comfytelegram.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comfytelegram"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]
