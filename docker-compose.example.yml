# Copy this file to docker-compose.yml before running it (`cp
# docker-compose.example.yml docker-compose.yml`) — unlike the rest of this
# file, the COMFYUI_LORAS_DIR bind mount below has no sane default, since it
# points at *your* ComfyUI install's models/loras directory, wherever that
# actually lives on this host. Edit that one line, then `docker compose up
# -d --build` as usual.

services:
  bot:
    build: .
    container_name: comfytelegram
    restart: unless-stopped
    env_file:
      - .env
    environment:
      STATE_DB_PATH: /app/data/state.sqlite3
      TAGS_DB_PATH: /app/data/tags.sqlite3
      COMFYUI_LORAS_DIR: /app/comfyui-loras
    volumes:
      # Bind-mounted straight to the repo path on the host, so the sqlite
      # files are the same ones `uv run comfytelegram` would produce outside
      # Docker — inspect/back them up directly, no volume commands needed.
      # (Generated images aren't written to disk at all — they're sent to
      # Telegram straight from memory — so there's no outputs/ mount here.)
      #
      # A *directory* mount, not one per sqlite file: Docker bind-mounts a
      # missing host *file* as an empty directory instead of creating a
      # file, which breaks sqlite3.connect() on first run — mounting the
      # containing directory instead sidesteps that entirely (a missing
      # host directory is exactly what Docker does create automatically),
      # no manual `touch`/setup step needed before the first `up`.
      - ./data:/app/data
      # Edit profiles on the host without rebuilding the image. Read-write,
      # not `:ro` — LoRA auto-discovery (see COMFYUI_LORAS_DIR below and
      # lora_discovery.py) writes newly-registered LoRA entries straight
      # into these files at boot, and silently can't if this is read-only
      # (no exception surfaces anywhere useful — the write happens inside
      # an unawaited background task). Drop this mount entirely if you're
      # fine with whatever was baked in at build time (auto-discovery then
      # has nothing it can persist to, so it's pointless without it anyway).
      - ./model_profiles:/app/model_profiles
      # The WD14 tagger's model.onnx + selected_tags.csv (~370MB), used by
      # the "🔬 Analyze & Regenerate" button for checkpoints whose model
      # profile sets "prompt_style": "tags". These are deliberately *not*
      # baked into the image (large, HF-hosted binary, gitignored on the
      # host too — see README's "Image analysis" section for how to fetch
      # them) — just bind-mount the same directory `uv run comfytelegram`
      # would read outside Docker.
      - ./models/wd14:/app/models/wd14:ro
      # MobileSAM's image encoder (~27MB) for the mask editor's "✨ Smart"
      # select — staged by hand like the WD14 files (see env.example's
      # SAM_ENCODER_PATH). Without it the feature is simply off.
      - ./models/mobilesam:/app/models/mobilesam:ro
      # Read-only access to ComfyUI's own models/loras directory, so the
      # "ℹ️ Info" button on /lora can hash a LoRA file locally and look up
      # its trigger words/base-model compatibility on CivitAI by that hash
      # (the same two-step lookup ComfyUI-Custom-Scripts' web/js/modelInfo.js
      # does, just server-side here instead of via a custom ComfyUI node
      # route). REPLACE THE LEFT SIDE with the actual path to your ComfyUI
      # install's models/loras directory on this host — there's no default
      # that could possibly be right for every install, unlike every other
      # mount above. Leave this line out entirely (and COMFYUI_LORAS_DIR
      # above unset) to skip the feature — the "ℹ️ Info" button is simply
      # omitted from /lora when it's not configured.
      - /path/to/your/ComfyUI/models/loras:/app/comfyui-loras:ro
    # ComfyUI (and, if you're using the "🔬 Analyze & Regenerate" button's
    # natural-language path, Ollama) are assumed to be running directly on
    # this host (the .env defaults COMFYUI_HOST=127.0.0.1/OLLAMA_HOST=
    # 127.0.0.1 match this repo's own working setup — see the main README's
    # Setup section). host networking is Linux-only — see the alternative
    # below for macOS/Windows.
    network_mode: host

    # macOS/Windows (Docker Desktop) alternative — `network_mode: host` is
    # not supported there. Comment out `network_mode: host` above, uncomment
    # this, and set COMFYUI_HOST=host.docker.internal and (if used)
    # OLLAMA_HOST=host.docker.internal in .env instead of 127.0.0.1:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
